name: Apply Wajbati submission hotfix

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        run: python .github/wajbati_hotfix.py
      - name: Validate JavaScript
        run: |
          node --check shared.js
          node --check app.js
          node --check admin.js
          grep -q 'WAJBATI_AGENT_V10_LIVE' shared.js
          grep -q 'WAJBATI_CANCEL_V10' app.js
          grep -q 'WAJBATI_ADMIN_CANCEL_V10' admin.js
      - name: Commit fixed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared.js app.js admin.js styles.css
          git commit -m "Finalize Wajbati for submission"
          git push
