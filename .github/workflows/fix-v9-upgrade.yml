name: Fix V9 upgrade decoder

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix base64 padding
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/upgrade-v9-once.yml')
          s=p.read_text()
          old="gzip.decompress(base64.b64decode(encoded))"
          new="gzip.decompress(base64.b64decode(encoded + '=' * (-len(encoded) % 4)))"
          if old not in s:
              raise SystemExit('decoder line not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/upgrade-v9-once.yml
          git commit -m "Fix V9 upgrade base64 padding"
          git push
