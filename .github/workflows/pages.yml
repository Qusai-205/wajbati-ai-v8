name: Deploy Wajbati AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stabilize customer cancellation controls
        run: python -c "import base64,pathlib; p=pathlib.Path('app.js'); s=p.read_text(encoding='utf-8'); m='/* WAJBATI_STABLE_TRACKING_V11 */'; patch=base64.b64decode('').decode(); p.write_text(s if m in s else s+patch,encoding='utf-8')"
      - name: Validate JavaScript
        run: node --check app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
